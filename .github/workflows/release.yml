# Builds the one-file download.
#
# Runs on a clean GitHub runner rather than a developer machine, so the binary
# embeds no local source paths and the release is reproducible from the tag alone.
# Needs no secrets: the built-in GITHUB_TOKEN is enough to create the release.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:   # build without releasing, to check the publish still works

permissions:
  contents: write      # only for creating the release; nothing else is needed

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The in-app update notice compares the latest release tag against the
      # assembly version, so a tag that outruns the csproj ships a build that
      # tells up-to-date users they're behind. v1.1.0 went out that way.
      - name: Tag must match the csproj version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $xml = [xml](Get-Content ArtifactViewer.csproj)
          $version = @($xml.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          $tag = "${{ github.ref_name }}".TrimStart('v')
          "csproj $version / tag $tag"
          if ($version -ne $tag) {
            throw "tag $tag does not match csproj version $version - bump <Version> before tagging"
          }

      # Single-file settings live in the csproj Release PropertyGroup.
      # ContinuousIntegrationBuild normalizes any remaining source paths.
      - name: Publish self-contained single file
        run: >
          dotnet publish ArtifactViewer.csproj
          -c Release -r win-x64
          -p:ContinuousIntegrationBuild=true
          -o publish

      - name: Report artifact size
        shell: pwsh
        run: |
          $exe = Get-Item publish/ArtifactViewer.exe
          "{0} - {1:N1} MB" -f $exe.Name, ($exe.Length / 1MB)
          $extra = Get-ChildItem publish -File | Where-Object Name -ne 'ArtifactViewer.exe'
          if ($extra) {
            $extra | Select-Object Name, Length
            throw "publish produced loose files alongside the exe; single-file packaging is broken"
          }

      # A published hash is the only verification on offer for an unsigned
      # binary, so it's computed here and shipped both ways: in the release
      # notes and as a separate asset.
      - name: Checksum and release body
        shell: pwsh
        run: |
          $exe = Get-Item publish/ArtifactViewer.exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $mb = "{0:N0}" -f ($exe.Length / 1MB)

          # .NET file APIs rather than Set-Content/Get-Content: explicit UTF-8
          # without a BOM whichever PowerShell runs this, so the notes can't
          # mojibake on the release page. Appended text is kept ASCII-only.
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText(
            "$pwd/ArtifactViewer.exe.sha256", "$hash  ArtifactViewer.exe`n", $utf8)

          $notes = [System.IO.File]::ReadAllText(
            "$pwd/.github/release-notes.md", [System.Text.Encoding]::UTF8)
          $tick = [string][char]96
          $fence = $tick * 3
          $footer = @"

          ---

          **ArtifactViewer.exe** - $mb MB, SHA-256:

          $fence
          $hash
          $fence

          Verify with ${tick}Get-FileHash ArtifactViewer.exe -Algorithm SHA256${tick}, or
          against the ${tick}ArtifactViewer.exe.sha256${tick} asset. Built by
          [run #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          from ${tick}${{ github.sha }}${tick}.
          "@
          [System.IO.File]::WriteAllText("$pwd/release-body.md", $notes + $footer, $utf8)
          "SHA-256: $hash"

      # Non-tag runs keep the exe as a build artifact for inspection
      - name: Upload build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: ArtifactViewer-exe
          path: |
            publish/ArtifactViewer.exe
            ArtifactViewer.exe.sha256

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          publish/ArtifactViewer.exe
          ArtifactViewer.exe.sha256
          --title "Artifact Viewer ${{ github.ref_name }}"
          --notes-file release-body.md
